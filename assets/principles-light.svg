<text x="48" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="-.3" fill="#1F2328">Understand systems deeply.</text>
